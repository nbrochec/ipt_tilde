name: CI

# ipt_tilde consumes its inference core from libipt (a git submodule) through the
# C ABI, and builds two Max externals (ipt~, pipo.ipt) plus a CLI example. This
# workflow builds the whole thing from scratch on Apple Silicon (libtorch is
# arm64-only) and runs a real runtime check: the CLI must load libipt.dylib +
# libtorch and classify against libipt's bundled dummy model.

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (Apple Silicon)
    runs-on: macos-14            # Apple Silicon — the only supported target
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # libipt (+ its model), min-api, pipo-sdk

      # libtorch is a ~150 MB pinned download fetched by libipt's CMake. Cache it
      # so only the first run (and torch version bumps) pay for it.
      - name: cache libtorch
        uses: actions/cache@v4
        with:
          path: libipt/libs/libtorch
          key: libtorch-2.4.1-osx-arm64

      - name: configure
        run: |
          set -eux
          # CMAKE_POLICY_VERSION_MINIMUM: min-api's test/mock ships an ancient
          # cmake_minimum_required that current CMake otherwise rejects.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: build
        run: cmake --build build -j 4

      - name: check externals + CLI were produced
        run: |
          set -eux
          test -d "externals/ipt~.mxo"
          test -d "externals/pipo.ipt.mxo"
          test -x build/app/ipt_example/ipt_example

      - name: runtime check — classify against libipt's dummy model
        run: |
          set -eux
          ./build/app/ipt_example/ipt_example libipt/tests/dummy.ts

      - name: unit test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Same build on Windows: libipt fetches the official MSVC libtorch (same
  # 2.4.1 CPU version — models are interchangeable), the externals come out as
  # flat .mxe64 files, and their DLL closure lands in the package's support/
  # folder (Max's DLL search path for packages).
  # ---------------------------------------------------------------------------
  build-windows:
    name: build & test (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # libipt (+ its model), min-api, pipo-sdk

      - name: cache libtorch
        uses: actions/cache@v4
        with:
          path: libipt/libs/libtorch
          key: libtorch-2.4.1-win-x64

      # bash, not the default pwsh: PowerShell tokenizes -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      # at the dot and CMake receives an invalid "3".
      - name: configure
        shell: bash
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: build
        shell: bash
        run: cmake --build build --config Release -j 4

      - name: check externals + support DLLs + CLI were produced
        shell: bash
        run: |
          set -eux
          find externals -name "ipt~.mxe64" | grep -q .
          find externals -name "pipo.ipt.mxe64" | grep -q .
          test -f support/ipt.dll
          test -f support/torch_cpu.dll
          test -x build/app/ipt_example/Release/ipt_example.exe

      - name: runtime check — classify against libipt's dummy model
        shell: bash
        run: ./build/app/ipt_example/Release/ipt_example.exe libipt/tests/dummy.ts

      # No ctest here: min-api's mock kernel (c74_mock_clock.h tick thread) hangs
      # at process teardown on Windows — an upstream issue, not covered by our
      # code. The same tests run on the macOS job, and the Windows runtime path
      # is proven by the CLI classification check above.
